let bg=new Image(),bgReady=false;bg.onload=()=>{bgReady=true;draw()};bg.src=defaultBg;
let bricks=[],ball,paddle,score=0,lives=3,playing=false,paused=false,ended=false,raf=0,last=0,held=0,progress=0;
function makeBricks(){bricks=[];let cols=8,rows=5,g=9,left=26,bw=(W-left*2-g*(cols-1))/cols,bh=35,colors=['#ff6b9d','#ffb45c','#ffe878','#70f5d0','#6ddaff'];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:left+c*(bw+g),y:115+r*(bh+12),w:bw,h:bh,color:colors[r%colors.length],alive:true});}
function reset(){score=0;lives=3;playing=false;paused=false;ended=false;held=0;paddle={x:300,y:830,w:120,h:16};ball={x:360,y:805,r:12,vx:4.2,vy:-6};makeBricks();update();draw();document.querySelector('#overlay').style.display='flex';document.querySelector('#title').textContent='隠された景色を解放しよう';document.querySelector('#message').innerHTML='ブロックを壊すたびに、幻想的な世界が少しずつ姿を現す。<br>全部壊して景色を完成させよう！';document.querySelector('#start').textContent='GAME START ▶';}
function update(){document.querySelector('#score').textContent=String(score).padStart(5,'0');document.querySelector('#lives').textContent=[0,1,2].map(i=>i<lives?'♥':'♡').join(' ');let n=bricks.filter(b=>b.alive).length;document.querySelector('#remaining').textContent=n;document.querySelector('#bar').style.width=((40-n)/40*100)+'%';}
function draw(){ctx.clearRect(0,0,W,H);if(bgReady){let s=Math.max(W/bg.width,H/bg.height),iw=bg.width*s,ih=bg.height*s;ctx.drawImage(bg,(W-iw)/2,(H-ih)/2,iw,ih)}else{ctx.fillStyle='#10182e';ctx.fillRect(0,0,W,H)}
// darken unbroken world for contrast
ctx.fillStyle='rgba(4,8,22,.34)';ctx.fillRect(0,0,W,H);
bricks.forEach(b=>{if(!b.alive)return;ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=14;ctx.fillStyle=b.color;ctx.globalAlpha=.96;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,6);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=.45;ctx.fillStyle='#fff';ctx.fillRect(b.x+5,b.y+4,b.w-10,3);ctx.restore();});
ctx.save();ctx.shadowColor='#72f8ff';ctx.shadowBlur=24;ctx.fillStyle='#80f7ff';ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,9);ctx.fill();ctx.restore();
ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=24;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore();}
function finish(win){playing=false;ended=true;document.querySelector('#overlay').style.display='flex';document.querySelector('#title').textContent=win?'WORLD REVEALED!':'GAME OVER';document.querySelector('#message').innerHTML=win?'隠された景色がすべて姿を現した！<br>スコア：'+score:'スコア：'+score+'<br>もう一度挑戦して景色を完成させよう。';document.querySelector('#start').textContent='もう一度遊ぶ ↻';}
function frame(t){if(!playing)return;if(!last)last=t;let dt=Math.min((t-last)/16.67,2);last=t;if(!paused){paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x+held*8*dt));ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x-4&&ball.x<=paddle.x+paddle.w+4){ball.y=paddle.y-ball.r;let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);let speed=Math.min(10,Math.hypot(ball.vx,ball.vy)+.08);ball.vx=hit*speed*.85;ball.vy=-Math.sqrt(Math.max(16,speed*speed-ball.vx*ball.vx));}
for(let b of bricks){if(!b.alive)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.alive=false;score+=100;ball.vy*=-1;break}}
if(ball.y>H+ball.r){lives--;if(lives<=0){update();draw();finish(false);return}else{ball={x:paddle.x+paddle.w/2,y:paddle.y-20,r:12,vx:4,vy:-6}}}
update();if(bricks.every(b=>!b.alive)){draw();finish(true);return}}
draw();raf=requestAnimationFrame(frame)}
function start(){if(ended)reset();document.querySelector('#overlay').style.display='none';playing=true;paused=false;last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
document.querySelector('#start').onclick=start;document.querySelector('#reset').onclick=reset;
document.querySelector('#pause').onclick=()=>{if(!playing)return;paused=!paused;document.querySelector('#pause').textContent=paused?'▶ 続ける':'Ⅱ 一時停止';if(paused){cancelAnimationFrame(raf);draw()}else{last=0;raf=requestAnimationFrame(frame)}};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);move(e);if(!playing&&!ended)start()});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});function move(e){let r=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)*W/r.width-paddle.w/2));if(!playing)draw()}
document.querySelector('#left').onpointerdown=e=>{e.preventDefault();held=-1};document.querySelector('#right').onpointerdown=e=>{e.preventDefault();held=1};['left','right'].forEach(id=>{document.querySelector('#'+id).onpointerup=()=>held=0;document.querySelector('#'+id).onpointerleave=()=>held=0;});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')held=-1;if(e.key==='ArrowRight')held=1;if(e.code==='Space'&&playing){e.preventDefault();document.querySelector('#pause').click()}});window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))held=0});
document.querySelector('#imageFile').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('画像ファイルを選んでね');let url=URL.createObjectURL(file),newBg=new Image();newBg.onload=()=>{bg=newBg;bgReady=true;draw();URL.revokeObjectURL(url)};newBg.src=url;});
